<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoadMatch</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;border:1px solid #e5e7eb}.btn{padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.light{background:white;border:1px solid #d0d5dd}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,select,textarea{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #d0d5dd;border-radius:8px;box-sizing:border-box}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.hidden{display:none}.load{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin:10px 0;background:white}.price{font-size:22px;font-weight:800}.muted{color:#667085;font-size:14px}.badge{padding:4px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><b>Load<span style="color:#60a5fa">Match</span></b><span id="who">Гост</span></header><main><div class="nav"><button class="btn primary" onclick="page('home')">Табло</button><button class="btn light" onclick="page('loads')">Товари</button><button class="btn light" onclick="page('publish')">Публикувай</button><button class="btn light" onclick="page('profile')">Профил</button><button class="btn light" onclick="logout()">Изход</button></div>
<section id="home"><div class="card"><h1>LoadMatch</h1><p>Платформа за свързване на товари и свободни шофьори.</p><button class="btn primary" onclick="page('loads')">Виж товари</button></div><div class="grid"><div class="card"><div class="muted">Товари</div><h2 id="sLoads">0</h2></div><div class="card"><div class="muted">Шофьори</div><h2 id="sDrivers">0</h2></div><div class="card"><div class="muted">Комисиони</div><h2 id="sFees">€0</h2></div></div></section>
<section id="loads" class="hidden"><div class="card"><div class="row"><h2>Товари</h2><input id="q" placeholder="Търси маршрут или товар" style="max-width:300px" oninput="loadLoads()"></div><div id="list"></div></div></section>
<section id="publish" class="hidden"><div class="card"><h2>Публикувай товар</h2><form id="pub" class="form"><div><label>От</label><input name="from" required></div><div><label>До</label><input name="to" required></div><div><label>Дата</label><input type="date" name="date" required></div><div><label>Тип</label><select name="type"><option>Палети</option><option>Пратка</option><option>Мебели</option><option>Строителни материали</option><option>Друго</option></select></div><div><label>Бюджет €</label><input type="number" name="price" min="1" required></div><div><label>Телефон</label><input name="phone"></div><div class="full"><label>Описание</label><textarea name="description"></textarea></div><div class="full"><button class="btn primary">Публикувай</button></div></form></div></section>
<section id="profile" class="hidden"><div class="card"><h2>Профил</h2><div id="profileBox"></div><button class="btn primary" onclick="login()">Вход / регистрация</button></div></section>
</main><script>
let me=null;const $=id=>document.getElementById(id);async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Грешка');return d}
function page(id){['home','loads','publish','profile'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='loads')loadLoads();if(id==='home')stats();if(id==='profile')profile()}
async function init(){let d=await api('/api/me');me=d.user;who.textContent=me?me.name+' · '+me.role:'Гост';stats();loadLoads();profile()}catch(e){console.error(e)}
async function stats(){try{let s=await api('/api/stats');sLoads.textContent=s.loads;sDrivers.textContent=s.drivers;sFees.textContent='€'+Number(s.fees).toFixed(2)}catch(e){}}
async function loadLoads(){try{let d=await api('/api/loads?q='+encodeURIComponent(q.value||''));list.innerHTML=d.length?d.map(l=>`<div class="load"><div class="row"><div><span class="badge">${l.status}</span><h3>${esc(l.from_city)} → ${esc(l.to_city)}</h3><div class="muted">${esc(l.date)} · ${esc(l.type)}</div></div><div class="price">€${Number(l.price).toFixed(2)}</div></div><p>${esc(l.description||'')}</p><div class="row"><span class="muted">Платформа: €${(l.price*.1).toFixed(2)}</span><button class="btn primary" onclick="apply(${l.id})">Кандидатствам</button></div></div>`).join(''):'<p class="muted">Няма товари.</p>'}catch(e){list.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function apply(id){try{if(!me){await login();return}if(me.role!=='Шофьор'){alert('Влез като Шофьор, за да кандидатстваш.');return}await api('/api/loads/'+id+'/apply',{method:'POST',body:'{}'});alert('Кандидатурата е изпратена.')}catch(e){alert(e.message)}}
pub.onsubmit=async e=>{e.preventDefault();try{if(!me){await login();return}if(me.role!=='Клиент'){alert('Само Клиент може да публикува.');return}let o=Object.fromEntries(new FormData(pub));await api('/api/loads',{method:'POST',body:JSON.stringify(o)});pub.reset();alert('Товарът е публикуван.');page('loads')}catch(e){alert(e.message)}}
async function login(){let name=prompt('Име (при регистрация остави ново име)');if(!name)return;let email=prompt('Имейл');if(!email)return;let password=prompt('Парола');if(!password)return;let role=prompt('Роля: Клиент или Шофьор','Шофьор')||'Шофьор';try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({name,email,password,role})});me=d.user;who.textContent=me.name+' · '+me.role;stats();profile();alert('Регистрацията е готова.')}catch(e){let d=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});me=d.user;who.textContent=me.name+' · '+me.role;stats();profile();alert('Влезе успешно.')}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;who.textContent='Гост';stats();profile();page('home')}
function profile(){profileBox.innerHTML=me?`<p><b>${esc(me.name)}</b></p><p class="muted">${esc(me.email)} · ${esc(me.role)}</p>`:'<p class="muted">Не сте влезли.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}init();
</script></body></html>
